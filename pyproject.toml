[project]
name = "agentic-rag"
version = "0.1.0"
description = "An agentic RAG assistant that answers company questions from documents, SQL metrics and the web."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.16.0",
    "lancedb>=0.36.0",
    "pandas>=3.0.5",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
    "simpleeval>=1.0.7",
    "tavily-python>=0.7.27",
]

[project.optional-dependencies]
# Readers for binary document formats. Everything else works without these.
docs = [
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
