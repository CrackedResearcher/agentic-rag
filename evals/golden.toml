# Golden set for the sample corpus in docs/.
#
# Run with: uv run agentic-rag eval
#
# Fields per case:
#   id              unique name, used by --case
#   question        what to ask
#   expect_tools    tools that must be called
#   forbid_tools    tools that must NOT be called
#   expect_sources  retrieval passes if any of these documents comes back
#   expect_contains substrings the answer must contain (commas and case ignored,
#                   so "12260" matches "$12,260 million")
#   must_refuse     the corpus has no answer; the agent must say so
#
# Facts here are taken from the documents in docs/. If you swap in your own
# corpus, rewrite these — a golden set is only as good as its ground truth.

# --------------------------------------------------------------------------- #
# Document retrieval — refund policy
# --------------------------------------------------------------------------- #

[[case]]
id = "refund-window"
question = "How many days do I have to return a Pixel phone bought from the Google Store?"
expect_tools = ["search_document_tool"]
forbid_tools = ["web_search_tool"]
expect_sources = ["refund_policy.md"]
expect_contains = ["15"]

[[case]]
id = "restocking-fee"
question = "Is there a restocking fee if I return a damaged device?"
expect_tools = ["search_document_tool"]
forbid_tools = ["web_search_tool"]
expect_sources = ["refund_policy.md"]
expect_contains = ["15%"]

[[case]]
id = "refund-timing"
question = "Once my return is inspected, how long until the refund is processed?"
expect_tools = ["search_document_tool"]
expect_sources = ["refund_policy.md"]
expect_contains = ["3 to 5"]

[[case]]
id = "gift-cards-refundable"
question = "Can I get a refund on a gift card?"
expect_tools = ["search_document_tool"]
forbid_tools = ["web_search_tool"]
expect_sources = ["refund_policy.md"]
expect_contains = ["not"]

