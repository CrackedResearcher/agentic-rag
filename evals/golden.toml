# --------------------------------------------------------------------------- #
# Retrieval from long filings — the answer is deep inside the document, not in
# its opening lines, which is where naive chunking tends to fail.
# --------------------------------------------------------------------------- #

[[case]]
id = "nvidia-q2-revenue"
question = "What revenue did NVIDIA report for the second quarter?"
expect_tools = ["search_document_tool"]
forbid_tools = ["web_search_tool"]
expect_sources = ["nvidia-FY2026 Q2 10-Q.txt"]
expect_contains = ["46.7"]

[[case]]
id = "nvidia-data-center"
question = "How much of NVIDIA's second quarter revenue came from Data Center?"
expect_tools = ["search_document_tool"]
forbid_tools = ["web_search_tool"]
expect_sources = ["nvidia-FY2026 Q2 10-Q.txt"]
expect_contains = ["41.1"]

[[case]]
id = "nvidia-outlook"
question = "What is NVIDIA's revenue outlook for the next quarter?"
expect_tools = ["search_document_tool"]
forbid_tools = ["web_search_tool"]
expect_sources = ["nvidia-FY2026 Q2 10-Q.txt"]
expect_contains = ["54.0"]

# --------------------------------------------------------------------------- #
# Structured metrics — these must route to SQL, not to document search
# --------------------------------------------------------------------------- #

[[case]]
id = "cloud-revenue-q1"
question = "What was Google Cloud revenue in Q1 of fiscal 2025?"
expect_tools = ["query_metrics_tool"]
forbid_tools = ["web_search_tool"]
expect_contains = ["12260"]

[[case]]
id = "services-operating-income"
question = "What was Google Services operating income in Q3 2025?"
expect_tools = ["query_metrics_tool"]
forbid_tools = ["web_search_tool"]
expect_contains = ["38900"]

[[case]]
id = "other-bets-loss"
question = "Did Other Bets make or lose money in Q1 2025, and how much?"
expect_tools = ["query_metrics_tool"]
forbid_tools = ["web_search_tool"]
expect_contains = ["1233"]

[[case]]
id = "cloud-growth-calculation"
question = "By what percentage did Google Cloud revenue grow from Q1 to Q3 of fiscal 2025?"
expect_tools = ["query_metrics_tool", "calculator_tool"]
forbid_tools = ["web_search_tool"]
expect_contains = ["23"]

# --------------------------------------------------------------------------- #
# Refusals — the corpus genuinely does not answer these. Confidently answering
# any of them means the grounding rules have stopped working.
# --------------------------------------------------------------------------- #

[[case]]
id = "refuse-parental-leave"
question = "How many weeks of paid parental leave does the company offer?"
forbid_tools = ["web_search_tool"]
must_refuse = true

[[case]]
id = "refuse-office-headcount"
question = "How many employees work in the Zurich office?"
forbid_tools = ["web_search_tool"]
must_refuse = true

[[case]]
id = "refuse-q2-cloud-revenue"
question = "What was Google Cloud revenue in Q2 of fiscal 2025?"
forbid_tools = ["web_search_tool"]
must_refuse = true
